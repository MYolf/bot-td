# Infrastructure complète (Phase 28) : API + bot Discord (app) et PostgreSQL.
#
# Démarrage : docker compose up -d --build
#
# Secrets : le fichier .env (DISCORD_BOT_TOKEN, TRADINGVIEW_WEBHOOK_SECRET...)
# est passé au service app via env_file ; il n'est jamais copié dans l'image
# (voir .dockerignore). DATABASE_URL est surchargé ici pour pointer vers le
# service postgres (dans le conteneur, "localhost" ne désigne plus la base).
# Les identifiants ci-dessous sont des identifiants de développement,
# cohérents avec le DATABASE_URL du .env local.

services:
  app:
    build: .
    container_name: bot-td-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot_td:bot_td_dev_password@postgres:5432/bot_td
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Moteur de signaux local (alternative gratuite à TradingView) : bougies
  # Binance -> Momentum V1 à la clôture -> POST interne vers le webhook.
  # Aucune clé d'exchange : données de marché publiques uniquement.
  engine:
    build: .
    container_name: bot-td-engine
    env_file: .env
    environment:
      ENGINE_WEBHOOK_URL: http://app:8000/webhook/tradingview
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "engine.runner"]

  postgres:
    image: postgres:16
    container_name: bot-td-postgres
    environment:
      POSTGRES_USER: bot_td
      POSTGRES_PASSWORD: bot_td_dev_password
      POSTGRES_DB: bot_td
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_td -d bot_td"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
